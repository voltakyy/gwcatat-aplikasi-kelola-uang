<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GWCATAT — Kelola Uang</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="bg-stone-100 text-slate-800 font-sans min-h-screen">

    <header class="bg-white border-b border-stone-200 sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold text-teal-800 tracking-tight">GWCATAT</h1>
        <div class="flex items-center space-x-2">
            <span class="text-xs bg-teal-100 text-teal-800 font-semibold px-2 py-1 rounded-full">v2.0 Tailwind</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">
        
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm">
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Total Saldo</p>
                <h2 id="totalBalance" class="text-2xl font-extrabold text-slate-900 mt-1">Rp 0</h2>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm">
                <p class="text-xs font-semibold uppercase tracking-wider text-emerald-600">Pemasukan</p>
                <h2 id="totalIncome" class="text-2xl font-extrabold text-emerald-600 mt-1">Rp 0</h2>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm">
                <p class="text-xs font-semibold uppercase tracking-wider text-rose-600">Pengeluaran</p>
                <h2 id="totalExpense" class="text-2xl font-extrabold text-rose-600 mt-1">Rp 0</h2>
            </div>
        </section>

        <section class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm">
            <h3 class="text-sm font-bold text-slate-700 mb-4">Grafik Keuangan</h3>
            <div class="relative w-full h-64">
                <canvas id="financeChart"></canvas>
            </div>
        </section>

    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
