<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — gwcatat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-[#FAF8F4] min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-lg border border-[#264653]/10 p-6 sm:p-8">
    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="w-16 h-16 rounded-2xl bg-[#264653] flex items-center justify-center mx-auto shadow-md">
        <svg viewBox="0 0 40 40" class="w-10 h-10 stroke-[#C89B3C] fill-none stroke-[2.4]">
          <circle cx="20" cy="20" r="17" />
          <path d="M13 28 L13 13 L20 22 L27 13 L27 28" />
          <path d="M20 22 L20 28" />
        </svg>
      </div>
      <h1 class="font-display font-bold text-2xl text-[#264653] mt-3">gwcatat</h1>
      <p class="text-sm text-[#2D2D2D]/60">Buat catatan harian keuangan dengan mudah.</p>
    </div>

    <!-- Tab Login / Register -->
    <div class="flex border-b border-[#2D2D2D]/10 mb-6">
      <button id="tabLogin" class="flex-1 py-2 text-sm font-semibold text-[#264653] border-b-2 border-[#C89B3C]">Masuk</button>
      <button id="tabRegister" class="flex-1 py-2 text-sm font-semibold text-[#2D2D2D]/50 hover:text-[#264653]">Daftar</button>
    </div>

    <!-- Form Login -->
    <form id="formLogin" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-[#2D2D2D]/50 mb-1">Email</label>
        <input type="email" id="loginEmail" placeholder="email@kamu.com" required class="w-full border border-[#2D2D2D]/10 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-[#C89B3C] focus:border-transparent" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-[#2D2D2D]/50 mb-1">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full border border-[#2D2D2D]/10 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-[#C89B3C] focus:border-transparent" />
      </div>
      <button type="submit" id="loginSubmit" class="w-full bg-[#264653] text-white font-semibold py-2 rounded-lg hover:bg-[#264653]/90 transition">Masuk</button>
      <div id="loginError" class="text-sm text-red-500 hidden"></div>
    </form>

    <!-- Form Register -->
    <form id="formRegister" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-[#2D2D2D]/50 mb-1">Nama</label>
        <input type="text" id="regName" placeholder="Nama kamu" required class="w-full border border-[#2D2D2D]/10 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-[#C89B3C] focus:border-transparent" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-[#2D2D2D]/50 mb-1">Email</label>
        <input type="email" id="regEmail" placeholder="email@kamu.com" required class="w-full border border-[#2D2D2D]/10 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-[#C89B3C] focus:border-transparent" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-[#2D2D2D]/50 mb-1">Password</label>
        <input type="password" id="regPassword" placeholder="Minimal 6 karakter" required class="w-full border border-[#2D2D2D]/10 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-[#C89B3C] focus:border-transparent" />
      </div>
      <button type="submit" id="registerSubmit" class="w-full bg-[#264653] text-white font-semibold py-2 rounded-lg hover:bg-[#264653]/90 transition">Daftar</button>
      <div id="registerError" class="text-sm text-red-500 hidden"></div>
    </form>

    <p class="text-center text-xs text-[#2D2D2D]/40 mt-6">Dengan melanjutkan, kamu setuju dengan Kebijakan Privasi kami.</p>
  </div>

  <script>
    // ===== LOGIC =====
    const formLogin = document.getElementById('formLogin')
    const formRegister = document.getElementById('formRegister')
    const tabLogin = document.getElementById('tabLogin')
    const tabRegister = document.getElementById('tabRegister')
    const loginError = document.getElementById('loginError')
    const registerError = document.getElementById('registerError')

    // Toggle tabs
    tabLogin.addEventListener('click', () => {
      formLogin.classList.remove('hidden')
      formRegister.classList.add('hidden')
      tabLogin.className = 'flex-1 py-2 text-sm font-semibold text-[#264653] border-b-2 border-[#C89B3C]'
      tabRegister.className = 'flex-1 py-2 text-sm font-semibold text-[#2D2D2D]/50 hover:text-[#264653]'
    })
    tabRegister.addEventListener('click', () => {
      formRegister.classList.remove('hidden')
      formLogin.classList.add('hidden')
      tabRegister.className = 'flex-1 py-2 text-sm font-semibold text-[#264653] border-b-2 border-[#C89B3C]'
      tabLogin.className = 'flex-1 py-2 text-sm font-semibold text-[#2D2D2D]/50 hover:text-[#264653]'
    })

    // Register
    formRegister.addEventListener('submit', (e) => {
      e.preventDefault()
      registerError.classList.add('hidden')
      const name = document.getElementById('regName').value.trim()
      const email = document.getElementById('regEmail').value.trim()
      const password = document.getElementById('regPassword').value
      if (password.length < 6) {
        registerError.textContent = 'Password minimal 6 karakter'
        registerError.classList.remove('hidden')
        return
      }
      // Simpan ke localStorage
      const users = JSON.parse(localStorage.getItem('gwcatat_users') || '[]')
      if (users.find(u => u.email === email)) {
        registerError.textContent = 'Email sudah terdaftar'
        registerError.classList.remove('hidden')
        return
      }
      users.push({ name, email, password })
      localStorage.setItem('gwcatat_users', JSON.stringify(users))
      alert('Pendaftaran berhasil! Silakan login.')
      tabLogin.click()
      document.getElementById('loginEmail').value = email
    })

    // Login
    formLogin.addEventListener('submit', (e) => {
      e.preventDefault()
      loginError.classList.add('hidden')
      const email = document.getElementById('loginEmail').value.trim()
      const password = document.getElementById('loginPassword').value
      const users = JSON.parse(localStorage.getItem('gwcatat_users') || '[]')
      const user = users.find(u => u.email === email && u.password === password)
      if (!user) {
        loginError.textContent = 'Email atau password salah'
        loginError.classList.remove('hidden')
        return
      }
      // Simpan session
      localStorage.setItem('gwcatat_session', JSON.stringify({ email: user.email, name: user.name }))
      window.location.href = '/index.html'
    })

    // Jika sudah login, langsung ke dashboard
    const session = JSON.parse(localStorage.getItem('gwcatat_session') || 'null')
    if (session) window.location.href = '/index.html'
  </script>
</body>
</html>
