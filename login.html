<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gwcatat — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="bg-warm-ivory min-h-screen flex items-center justify-center p-4 font-body">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-lg border border-beige p-6 sm:p-8">
    <!-- Brand -->
    <div class="text-center mb-6">
      <div class="w-16 h-16 rounded-2xl bg-deep-forest flex items-center justify-center mx-auto shadow-md">
        <svg viewBox="0 0 40 40" class="w-10 h-10 stroke-muted-gold fill-none stroke-[2.4]"><circle cx="20" cy="20" r="17" /><path d="M13 28 L13 13 L20 22 L27 13 L27 28" /><path d="M20 22 L20 28" /></svg>
      </div>
      <h1 class="font-display font-bold text-2xl text-deep-forest mt-3">gwcatat</h1>
      <p class="text-sm text-charcoal/60">Catat hari ini, tenang nanti.</p>
    </div>

    <!-- Tab Login/Register -->
    <div class="flex border-b border-beige mb-6">
      <button id="tabLogin" class="flex-1 py-2 text-sm font-semibold text-deep-forest border-b-2 border-muted-gold">Masuk</button>
      <button id="tabRegister" class="flex-1 py-2 text-sm font-semibold text-charcoal/50 hover:text-deep-forest">Daftar</button>
    </div>

    <!-- Form Login -->
    <form id="formLogin" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-charcoal/50 mb-1">Email</label>
        <input type="email" id="loginEmail" placeholder="email@kamu.com" required class="w-full border border-beige rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-muted-gold focus:border-transparent" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-charcoal/50 mb-1">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full border border-beige rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-muted-gold focus:border-transparent" />
      </div>
      <button type="submit" id="loginSubmit" class="w-full bg-deep-forest text-white font-semibold py-2 rounded-lg hover:bg-deep-forest/90 transition-colors">Masuk</button>
      <div id="loginError" class="text-sm text-red-500 hidden"></div>
    </form>

    <!-- Form Register -->
    <form id="formRegister" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-charcoal/50 mb-1">Nama</label>
        <input type="text" id="regName" placeholder="Nama kamu" required class="w-full border border-beige rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-muted-gold focus:border-transparent" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-charcoal/50 mb-1">Email</label>
        <input type="email" id="regEmail" placeholder="email@kamu.com" required class="w-full border border-beige rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-muted-gold focus:border-transparent" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-charcoal/50 mb-1">Password</label>
        <input type="password" id="regPassword" placeholder="Minimal 6 karakter" required class="w-full border border-beige rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-muted-gold focus:border-transparent" />
      </div>
      <button type="submit" id="registerSubmit" class="w-full bg-deep-forest text-white font-semibold py-2 rounded-lg hover:bg-deep-forest/90 transition-colors">Daftar</button>
      <div id="registerError" class="text-sm text-red-500 hidden"></div>
    </form>

    <p class="text-center text-xs text-charcoal/40 mt-6">Dengan melanjutkan, kamu setuju dengan Kebijakan Privasi kami.</p>
  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
