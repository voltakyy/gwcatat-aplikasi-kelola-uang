<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — gwcatat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Sign-In Script -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-[#FAF8F4] min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-3xl shadow-lg border border-[#264653]/10 p-8">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-[#264653] flex items-center justify-center mx-auto shadow-md">
        <svg viewBox="0 0 40 40" class="w-10 h-10 stroke-[#C89B3C] fill-none stroke-[2.4]">
          <circle cx="20" cy="20" r="17" />
          <path d="M13 28 L13 13 L20 22 L27 13 L27 28" />
          <path d="M20 22 L20 28" />
        </svg>
      </div>
      <h1 class="font-display font-bold text-2xl text-[#264653] mt-4">gwcatat</h1>
      <p class="text-sm text-[#2D2D2D]/60 mt-1">Buat catatan harian keuangan dengan mudah.</p>
    </div>

    <!-- Pesan Ajakan -->
    <div class="text-center mb-8">
      <h2 class="text-lg font-semibold text-[#2D2D2D]">Selamat Datang!</h2>
      <p class="text-sm text-[#2D2D2D]/60 mt-2">Silakan masuk menggunakan akun Google kamu untuk melanjutkan ke aplikasi.</p>
    </div>

    <!-- Google Sign-In Button Container -->
    <div class="flex justify-center mb-4">
      <div id="g_id_onload"
           data-client_id="697552116251-rf9bhqg0taqhstef2kko3t9b4eke1lr5.apps.googleusercontent.com"
           data-context="signin"
           data-ux_mode="popup"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-shape="rectangular"
           data-theme="outline"
           data-text="signin_with"
           data-size="large"
           data-logo_alignment="center">
      </div>
    </div>

    <p class="text-center text-xs text-[#2D2D2D]/40 mt-8">Dengan masuk, kamu setuju dengan Kebijakan Privasi kami.</p>
  </div>

  <script>
    // ===== GOOGLE LOGIN LOGIC =====
    function parseJwt(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      // Decode response credential (JWT)
      const data = parseJwt(response.credential);
      const email = data.email;
      const name = data.name;

      // Simpan user
      const users = JSON.parse(localStorage.getItem('gwcatat_users') || '[]');
      if (!users.find(u => u.email === email)) {
        users.push({ name: name, email: email, password: 'google_oauth_user' });
        localStorage.setItem('gwcatat_users', JSON.stringify(users));
      }

      // Buat sesi login
      localStorage.setItem('gwcatat_session', JSON.stringify({ email: email, name: name }));
      
      // Arahkan ke halaman utama
      window.location.href = '/index.html';
    }

    // Jika sudah login, langsung ke dashboard
    const session = JSON.parse(localStorage.getItem('gwcatat_session') || 'null')
    if (session) window.location.href = '/index.html'
  </script>
</body>
</html>
